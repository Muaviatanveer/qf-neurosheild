# configs/baseline.yaml
dataset:
  raw_dir: "data/raw"
  metadata_csv: "data/splits/metadata.csv"
  num_frames: 8
  image_size: 224
  crop_face: true

model:
  pretrained_name: "google/vit-base-patch16-224-in21k"
  num_classes: 2
  freeze_backbone: true

training:
  batch_size: 2
  epochs: 10
  learning_rate: 0.0005
  seed: 42
  save_dir: "checkpoints"